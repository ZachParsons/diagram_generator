<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagram Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>Diagram Generator</h1>

      <div id="pane-container"></div>

      <section class="panel">
        <h2>Input data</h2>
        <label class="checkbox-row">
          <input type="checkbox" id="use-input-data" />
          Use input data instead of pure random
        </label>
        <button id="load-sample-data">Load sample data</button>
        <label class="file-row">
          Import data JSON
          <input type="file" id="import-data-file" accept="application/json" />
        </label>
        <textarea id="paste-data-textarea" rows="4" placeholder='{"nodes":[{"id":"a","connections":["b"]},{"id":"b","connections":[]}]}'></textarea>
        <button id="apply-pasted-data">Use pasted data</button>
        <div class="status" id="data-status"></div>
      </section>

      <section class="panel">
        <h2>Diagram file</h2>
        <label class="file-row">
          Import diagram JSON
          <input type="file" id="import-diagram-file" accept="application/json" />
        </label>
        <p class="hint">Loads a diagram JSON directly into the viewers below, bypassing the generator entirely.</p>
      </section>

      <section class="panel">
        <h2>Download location</h2>
        <div class="status" id="download-folder-status"></div>
        <button id="choose-download-folder">Choose folder&hellip;</button>
        <button id="clear-download-folder" hidden>Use browser default</button>
        <p class="hint">Chromium browsers (Chrome/Edge) only. Once set, exports save straight there with no dialog.</p>
      </section>

      <div class="status" id="status"></div>
    </aside>

    <main id="main">
      <div id="sketch-container"></div>
      <div id="view-controls">
        <button id="zoom-in" type="button" title="Zoom in">+</button>
        <button id="zoom-out" type="button" title="Zoom out">&minus;</button>
        <button id="zoom-reset" type="button" title="Reset pan/zoom">&#8634;</button>
      </div>
      <div id="table-drawer">
        <button id="table-drawer-toggle" type="button">
          <span class="chevron">&#9650;</span> Table
        </button>
        <div id="table-container"></div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.js"></script>

  <script src="src/rng.js"></script>
  <script src="src/schema.js"></script>
  <script src="src/layouts.js"></script>
  <script src="src/generator.js"></script>
  <script src="src/canvasRenderer.js"></script>
  <script src="src/tableRenderer.js"></script>
  <script src="src/controls.js"></script>
  <script src="data/sample-input.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
